esphome:
  name: xiao-ir-aux-ifeel
  friendly_name: XIAO IR AUX iFeel
  includes:
    - electra_ifeel.h
  platformio_options:
    lib_deps:
      - crankyoldgit/IRremoteESP8266@^2.8.0
  on_boot:
    - lambda: |-
        ifeel_setup();

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

logger:
  level: INFO
api:
ota:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Xiao-IR-iFeel
    password: "12345678"
captive_portal:

number:
  - platform: template
    name: iFeel temperature
    id: ifeel_temp
    min_value: 16
    max_value: 30
    step: 1
    initial_value: 24
    optimistic: true
    unit_of_measurement: °C

button:
  - platform: template
    name: Send IFeel ON (full, beeps)
    on_press:
      - lambda: |-
          uint8_t t = (uint8_t)id(ifeel_temp).state;
          ifeel_on(t);
          ESP_LOGI("ifeel", "Sent FULL IFeel ON, temp %d", t);
  - platform: template
    name: Send sensor temp (silent)
    on_press:
      - lambda: |-
          uint8_t s = (uint8_t)id(ifeel_temp).state;
          ifeel_sensor(s);
          ESP_LOGI("ifeel", "Sent SENSOR update %d", s);
