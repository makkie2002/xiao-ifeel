esphome:
  name: xiao-ir-aux-ifeel-single
  friendly_name: XIAO IR AUX iFeel

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

logger:
  level: INFO
api:
ota:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Xiao-IR-iFeel
    password: "12345678"
captive_portal:

remote_transmitter:
  pin: GPIO3
  carrier_duty_percent: 50%

remote_receiver:
  id: rcvr
  pin:
    number: GPIO4
    inverted: true
  tolerance: 55%
  dump: all

sensor:
  - platform: homeassistant
    entity_id: sensor.toon_beneden_temperatuur
    id: room_temp
    internal: true

globals:
  - id: last_ifeel_sent
    type: float
    initial_value: "-100.0"

number:
  - platform: template
    name: iFeel sensor temperature
    id: ifeel_temp
    min_value: 16
    max_value: 30
    step: 1
    initial_value: 24
    optimistic: true
    unit_of_measurement: °C

script:
  - id: send_ifeel_silent
    parameters:
      temp: float
    then:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: !lambda |-
            // ELECTRA_AC silent sensor update (AUX/YKR-L iFeel)
            // Template from IRremoteESP8266 dumps, only byte7 + checksum change.
            // Timings: hdr 9166/4470, bit 646, one 1647, zero 547, LSB-first.
            uint8_t sensor = (uint8_t)temp;
            if (sensor > 50) sensor = 50;
            uint8_t state[13] = {0xC3, 0x5F, 0xE0, 0x40, 0x60, 0x00,
                                 0x88, (uint8_t)(sensor + 0x4A), 0x00,
                                 0x30, 0x00, 0x1E, 0x00};
            uint16_t sum = 0;
            for (int i = 0; i < 12; i++) sum += state[i];
            state[12] = (uint8_t)(sum & 0xFF);
            std::vector<long int> raw;
            raw.reserve(2 + 104 * 2 + 2);
            raw.push_back(9166);
            raw.push_back(-4470);
            for (int i = 0; i < 13; i++) {
              uint8_t b = state[i];
              for (int j = 0; j < 8; j++) {
                raw.push_back(646);
                raw.push_back((b & 1) ? -1647 : -547);
                b >>= 1;
              }
            }
            raw.push_back(646);
            raw.push_back(-20000);
            ESP_LOGI("ifeel", "sensor %dC -> %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X",
                     sensor, state[0], state[1], state[2], state[3], state[4],
                     state[5], state[6], state[7], state[8], state[9],
                     state[10], state[11], state[12]);
            return raw;

button:
  - platform: template
    name: Send sensor temp (silent, no beep)
    on_press:
      - script.execute:
          id: send_ifeel_silent
          temp: !lambda return id(ifeel_temp).state;

interval:
  - interval: 5min
    then:
      - lambda: |-
          if (isnan(id(room_temp).state)) {
            ESP_LOGW("ifeel", "room sensor unavailable, skipping auto-send");
            return;
          }
          float t = id(room_temp).state;
          if (fabs(t - id(last_ifeel_sent)) < 0.5 && id(last_ifeel_sent) > -99.0) {
            ESP_LOGI("ifeel", "room %.1fC unchanged, skipping", t);
            return;
          }
          id(last_ifeel_sent) = t;
          id(send_ifeel_silent).execute(t);
