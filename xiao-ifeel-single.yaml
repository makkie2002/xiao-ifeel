esphome:
  name: xiao-ir-aux-ifeel-single
  friendly_name: XIAO IR AUX iFeel

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

logger:
  level: INFO
api:
ota:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Xiao-IR-iFeel
    password: "12345678"
captive_portal:

remote_transmitter:
  pin: GPIO3
  carrier_duty_percent: 50%
  non_blocking: true

remote_receiver:
  id: rcvr
  pin:
    number: GPIO4
    inverted: true
  tolerance: 55%
  on_raw:
    - lambda: |-
        // ELECTRA_AC sniffer: hdr ~9166/~4470, bit ~646, one ~1647, zero ~547, LSB-first, 13 bytes
        auto &r = x;
        int n = (int)r.size();
        for (int i = 0; i + 2 + 2 * 104 <= n; i++) {
          if (r[i] < 7000 || r[i] > 11500) continue;
          int hsp = -r[i + 1];
          if (hsp < 3000 || hsp > 6200) continue;
          uint8_t st[13] = {0};
          bool ok = true;
          for (int k = 0; k < 104; k++) {
            int m = r[i + 2 + 2 * k];
            int s = -r[i + 3 + 2 * k];
            if (m < 250 || m > 1100) { ok = false; break; }
            int bit;
            if (s > 1000 && s < 2600) bit = 1;
            else if (s > 200 && s <= 1000) bit = 0;
            else { ok = false; break; }
            st[k / 8] |= (uint8_t)(bit << (k % 8));
          }
          if (!ok) continue;
          uint16_t sum = 0;
          for (int j = 0; j < 12; j++) sum += st[j];
          bool ck = ((uint8_t)(sum & 0xFF) == st[12]);
          ESP_LOGI("electra", "RX %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X CKSUM_%s",
                   st[0], st[1], st[2], st[3], st[4], st[5], st[6],
                   st[7], st[8], st[9], st[10], st[11], st[12],
                   ck ? "OK" : "FAIL");
          break;
        }

sensor:
  - platform: homeassistant
    entity_id: sensor.toon_beneden_temperatuur
    id: room_temp
    internal: true

globals:
  - id: last_ifeel_sent
    type: float
    initial_value: "-100.0"
  - id: last_power
    type: int
    initial_value: "-1"
  - id: ac_mode_str
    type: std::string
    initial_value: '"Heat"'
  - id: ac_fan_str
    type: std::string
    initial_value: '"Auto"'

number:
  - platform: template
    name: iFeel sensor temperature
    id: ifeel_temp
    min_value: 16
    max_value: 30
    step: 1
    initial_value: 24
    optimistic: true
    unit_of_measurement: °C
  - platform: template
    name: AC setpoint
    id: setpoint_temp
    min_value: 16
    max_value: 30
    step: 0.5
    initial_value: 21.5
    optimistic: true
    unit_of_measurement: °C

select:
  - platform: template
    name: AC mode
    id: ac_mode
    options:
      - Heat
      - Cool
      - Dry
      - Auto
      - Fan
    initial_option: Heat
    optimistic: true
    on_value:
      - lambda: |-
          id(ac_mode_str) = x;
  - platform: template
    name: AC fan
    id: ac_fan
    options:
      - Auto
      - Low
      - Medium
      - High
    initial_option: Auto
    optimistic: true
    on_value:
      - lambda: |-
          id(ac_fan_str) = x;

switch:
  - platform: template
    name: iFeel enabled
    id: ifeel_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute:
          id: apply_current_state
    turn_off_action:
      - script.execute:
          id: apply_current_state
  - platform: template
    name: AC quiet
    id: ac_quiet
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute:
          id: apply_current_state
    turn_off_action:
      - script.execute:
          id: apply_current_state

script:
  - id: electra_tx
    parameters:
      b0: int
      b1: int
      b2: int
      b3: int
      b4: int
      b5: int
      b6: int
      b7: int
      b8: int
      b9: int
      b10: int
      b11: int
    then:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: !lambda |-
            // ELECTRA_AC 13-byte frame, LSB-first per byte.
            // hdr 9166/4470, bit 646, one 1647, zero 547.
            uint8_t state[13] = {(uint8_t)b0, (uint8_t)b1, (uint8_t)b2,
                                 (uint8_t)b3, (uint8_t)b4, (uint8_t)b5,
                                 (uint8_t)b6, (uint8_t)b7, (uint8_t)b8,
                                 (uint8_t)b9, (uint8_t)b10, (uint8_t)b11, 0};
            uint16_t sum = 0;
            for (int i = 0; i < 12; i++) sum += state[i];
            state[12] = (uint8_t)(sum & 0xFF);
            std::vector<long int> raw;
            raw.reserve(2 + 104 * 2 + 2);
            raw.push_back(9166);
            raw.push_back(-4470);
            for (int i = 0; i < 13; i++) {
              uint8_t v = state[i];
              for (int j = 0; j < 8; j++) {
                raw.push_back(646);
                raw.push_back((v & 1) ? -1647 : -547);
                v >>= 1;
              }
            }
            raw.push_back(646);
            raw.push_back(-20000);
            ESP_LOGI("ifeel", "TX %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X",
                     state[0], state[1], state[2], state[3], state[4],
                     state[5], state[6], state[7], state[8], state[9],
                     state[10], state[11], state[12]);
            return raw;
  - id: apply_current_state
    then:
      - lambda: |-
          if (id(last_power) < 0) {
            ESP_LOGI("ifeel", "state change armed, applies on next AC ON/OFF");
          } else {
            id(send_ac_state).execute(id(last_power));
          }
  - id: send_ifeel_silent
    parameters:
      temp: float
    then:
      - lambda: |-
          // Silent iFeel sensor update: integer degrees only (byte7, no half-bit).
          // Template cloned from real YKR-L/101E silent frame 2026-11-06
          // (C3 8F E0 40 60 80 88 61 00 30 00 1E 89 = sensor 23C).
          uint8_t sensor = (uint8_t)(temp + 0.5f);
          if (sensor > 50) sensor = 50;
          id(electra_tx).execute(0xC3, 0x8F, 0xE0, 0x40, 0x60, 0x80,
                                 0x88, sensor + 0x4A, 0x00, 0x30, 0x00, 0x1E);
  - id: send_ac_state
    parameters:
      power: int
    then:
      - lambda: |-
          // Full-state command cloned from YKR-L/101E captures (Heat/FanLow/SwingOff baseline).
          // Setpoint: Temp field = int part - 8, byte3 bit7 (0x80) = +0.5C (found by capture 2026-11-06).
          float t = roundf(id(setpoint_temp).state * 2.0f) / 2.0f;
          if (t < 16.0f) t = 16.0f;
          if (t > 30.0f) t = 30.0f;
          int ip = (int)t;
          bool half = (t - ip) >= 0.5f;
          uint8_t b1 = (uint8_t)(((ip - 8) << 3) | 0x07);
          uint8_t b3 = half ? 0x80 : 0x00;
          std::string m = id(ac_mode_str);
          uint8_t mode = 4;
          if (m == "Cool") mode = 1;
          else if (m == "Dry") mode = 2;
          else if (m == "Heat") mode = 4;
          else if (m == "Fan") mode = 6;
          else mode = 0;
          std::string f = id(ac_fan_str);
          uint8_t fan = 5;
          if (f == "Low") fan = 3;
          else if (f == "Medium") fan = 2;
          else if (f == "High") fan = 1;
          else fan = 5;
          bool ifeel = id(ifeel_enabled).state;
          uint8_t b6 = (uint8_t)((mode << 5) | (ifeel ? 0x08 : 0x00));
          bool quiet = id(ac_quiet).state;
          uint8_t b5 = quiet ? 0x80 : 0x00;
          uint8_t sens;
          if (!isnan(id(room_temp).state)) sens = (uint8_t)(id(room_temp).state + 0.5f);
          else sens = (uint8_t)ip;
          if (sens > 50) sens = 50;
          uint8_t b9 = power ? 0x30 : 0x10;
          id(electra_tx).execute(0xC3, b1, 0xE0, b3, (uint8_t)(fan << 5), b5,
                                 b6, (uint8_t)(sens + 0x4A),
                                 0x00, b9, 0x00, 0x00);

button:
  - platform: template
    name: Send sensor temp (silent, no beep)
    on_press:
      - if:
          condition:
            lambda: return id(ifeel_enabled).state;
          then:
            - script.execute:
                id: send_ifeel_silent
                temp: !lambda return id(ifeel_temp).state;
          else:
            - logger.log: "iFeel is disabled on AC, silent send skipped"
  - platform: template
    name: AC ON (apply mode + setpoint)
    on_press:
      - lambda: |-
          id(last_power) = 1;
      - script.execute:
          id: send_ac_state
          power: 1
  - platform: template
    name: AC OFF
    on_press:
      - lambda: |-
          id(last_power) = 0;
      - script.execute:
          id: send_ac_state
          power: 0

interval:
  - interval: 5min
    then:
      - lambda: |-
          if (!id(ifeel_enabled).state) {
            ESP_LOGI("ifeel", "iFeel disabled, auto-send paused");
            return;
          }
          if (isnan(id(room_temp).state)) {
            ESP_LOGW("ifeel", "room sensor unavailable, skipping auto-send");
            return;
          }
          float t = id(room_temp).state;
          if (fabs(t - id(last_ifeel_sent)) < 0.5 && id(last_ifeel_sent) > -99.0) {
            ESP_LOGI("ifeel", "room %.1fC unchanged, skipping", t);
            return;
          }
          id(last_ifeel_sent) = t;
          id(send_ifeel_silent).execute(t);
